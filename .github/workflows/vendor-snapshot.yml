name: Renderer dependency snapshot
on:
  push:
    branches: [astra/ca-r4-atlas]
    paths: [.github/workflows/vendor-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the same Three.js release used by the application
        working-directory: ${{ runner.temp }}
        run: |
          npm pack --ignore-scripts three@0.169.0
          sha256sum three-0.169.0.tgz > three-0.169.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: three-r169-source
          path: |
            ${{ runner.temp }}/three-0.169.0.tgz
            ${{ runner.temp }}/three-0.169.0.sha256
          retention-days: 3
          if-no-files-found: error
