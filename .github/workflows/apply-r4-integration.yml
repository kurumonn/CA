name: Materialize reviewed Round 4 source and assets
on:
  push:
    branches: [astra/ca-r4-atlas]
    paths: [.github/workflows/apply-r4-integration.yml]
permissions:
  contents: write
concurrency:
  group: ca-r4-materialization
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'kurumonn/CA' && github.ref == 'refs/heads/astra/ca-r4-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline and decode the reviewed source-only patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lab/pkilab.py)" = '35dc3d13119de97aaa7a741b804f3a9653f77e4b'
          mkdir -p "$RUNNER_TEMP/r4-evidence"
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          text = ''.join(Path(f'.automation/r4-payload/{i}.txt').read_text() for i in range(8))
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0c4b114a7a7f5c241de367fec2e1e21ddfb9381123ef3470a302ccb93c7fd020'
          Path(os.environ['RUNNER_TEMP'], 'r4-evidence', 'round4-source.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/r4-evidence/round4-source.patch"
          git apply "$RUNNER_TEMP/r4-evidence/round4-source.patch"
      - name: Generate original split GLBs and validate their PBR references
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-art.txt
          python tools/build_atlas.py
          python tools/check_atlas.py --report "$RUNNER_TEMP/r4-evidence/glb-validation.json"
      - name: Vendor the version-matched official loader and utility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/three-r169"
          cd "$RUNNER_TEMP/three-r169"
          npm pack --ignore-scripts three@0.169.0
          echo 'c86d0937570fb425d981e156ddf919c43dbc45d4e91fd7c8dd0de56723b3ec71  three-0.169.0.tgz' | sha256sum --check -
          tar -xzf three-0.169.0.tgz
          mkdir -p "$GITHUB_WORKSPACE/viz/vendor/three/addons/loaders" "$GITHUB_WORKSPACE/viz/vendor/three/addons/utils"
          cp package/examples/jsm/loaders/GLTFLoader.js "$GITHUB_WORKSPACE/viz/vendor/three/addons/loaders/"
          cp package/examples/jsm/utils/BufferGeometryUtils.js "$GITHUB_WORKSPACE/viz/vendor/three/addons/utils/"
      - name: Run actual CA tests, lesson tests and the disposable end-to-end demo
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s lab/tests -v 2>&1 | tee "$RUNNER_TEMP/r4-evidence/lab-tests.log"
          (cd viz && npm test) 2>&1 | tee "$RUNNER_TEMP/r4-evidence/lesson-tests.log"
          PKILAB_DEMO_PORT=18443 PKILAB_KDF_ITER=20000 bash lab/scripts/demo.sh "$RUNNER_TEMP/r4-demo" 2>&1 | tee "$RUNNER_TEMP/r4-evidence/demo.log"
      - name: Commit only application files to the isolated work branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/astra/ca-r4-atlas | cut -f1)" = "$EXPECTED_HEAD"
          git add README.md articles docs lab tools viz
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Round 4 CA regressions and 40 split-GLB PBR lesson integration'
          git push origin HEAD:refs/heads/astra/ca-r4-atlas
          git rev-parse HEAD > "$RUNNER_TEMP/r4-evidence/implementation-commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/r4-evidence/implementation-tree.txt"
          git archive --format=zip --output="$RUNNER_TEMP/r4-evidence/CA-round4-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ca-round4-materialization
          path: ${{ runner.temp }}/r4-evidence/
          retention-days: 7
          if-no-files-found: error
