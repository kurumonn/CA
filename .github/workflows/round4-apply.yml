name: Apply validated CA round 4

on:
  push:
    branches: [claude/private-ca-design-3d-sfyvi9]
    paths: ['.maintenance/round4/*.bin']

permissions:
  contents: read

concurrency:
  group: ca-round4-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.repository == 'kurumonn/CA' && contains(github.event.head_commit.message, '[round4-apply]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the expected base and exact patch
        env:
          EXPECTED_PARENT: bbebbd5c6e462a68061984b3e9de12108527288b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import gzip, hashlib, os
          from pathlib import Path
          compressed = b''.join(Path(f'.maintenance/round4/part{i}.bin').read_bytes() for i in range(4))
          patch = gzip.decompress(compressed)
          assert len(patch) == 75944
          assert hashlib.sha256(patch).hexdigest() == '301c1163b21f8eb367f36f674ec57512b1bb2f00235bc02eeb30e18892d8c72d'
          Path(os.environ['RUNNER_TEMP'], 'round4.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/round4.patch"
          git apply --index "$RUNNER_TEMP/round4.patch"
          git diff --cached --check
      - name: Validate CA, lesson logic, and real TLS demo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/round4-logs"
          python3 --version | tee "$RUNNER_TEMP/round4-logs/python.log"
          openssl version | tee "$RUNNER_TEMP/round4-logs/openssl.log"
          python3 -m unittest discover -s lab/tests -v 2>&1 | tee "$RUNNER_TEMP/round4-logs/lab.log"
          (cd viz && npm test) 2>&1 | tee "$RUNNER_TEMP/round4-logs/viz-logic.log"
          PKILAB_DEMO_PORT=19443 PKILAB_KDF_ITER=20000 bash lab/scripts/demo.sh "$RUNNER_TEMP/round4-demo" 2>&1 | tee "$RUNNER_TEMP/round4-logs/demo.log"
      - name: Commit only verified source changes; remove one-shot transport
        run: |
          set -euo pipefail
          git rm .maintenance/round4/part0.bin .maintenance/round4/part1.bin .maintenance/round4/part2.bin .maintenance/round4/part3.bin .github/workflows/round4-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete round 4 CA boundary hardening and regression coverage' -m 'Restore revocation completion exports without weakening assertions. Add durable request intent replay, serialized resume and post-fence integrity/key checks. Align boundary contracts, documentation and fail-fast demo. Remove temporary patch transport after validation.'
          git push origin HEAD:refs/heads/claude/private-ca-design-3d-sfyvi9
          git rev-parse HEAD | tee "$RUNNER_TEMP/round4-logs/COMMIT.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-validation-logs
          path: ${{ runner.temp }}/round4-logs/
          if-no-files-found: error
          retention-days: 14
